name: VlcCustomIOS
options:
  bundleIdPrefix: com.vlccustom
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    from: 4.0.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.1.0
targets:
  VlcCustomIOS:
    type: application
    platform: iOS
    sources:
      - path: VlcCustomIOS
    info:
      path: VlcCustomIOS/Info.plist
      properties:
        CFBundleShortVersionString: "0.28"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "Cần quyền mạng cục bộ để duyệt và phát video từ máy tính chia sẻ qua SMB trong cùng mạng Wi-Fi."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vlccustom.ios
        MARKETING_VERSION: "0.28"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: false
        CODE_SIGNING_ALLOWED: false
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      # Explicit `embed: true` — without it, `xcodebuild archive` (used for the real .ipa) does not copy the AMSMB2
      # framework into the app bundle even though it links against it, so the app compiles and even runs fine from a
      # plain Simulator build, but crashes at launch on a real device with a dyld "Library not loaded" error. Caught
      # from a real crash log (2026-09-22). WhisperKit does NOT take `embed: true` — its SPM product is not a
      # separate framework bundle to copy (adding it makes the archive step itself fail looking for a
      # "WhisperKit" build product that does not exist); it links statically instead, which needs no embedding.
      - package: AMSMB2
        embed: true
      - package: WhisperKit
        product: WhisperKit
