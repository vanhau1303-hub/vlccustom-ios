name: SMB playback end-to-end

# Real end-to-end check of SMB video playback without an iPhone: runs a Samba server on the macOS runner, serves
# ffmpeg-generated test clips from it, and launches the app in the Simulator with the DEMO_SMB_* hook
# (ContentView.swift) so it connects and plays each clip by itself. Uploads the app's diagnostics log + a screenshot
# per clip, and FAILS if the log never shows playback time advancing.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "VlcCustomIOS/**"
      - "project.yml"
      - "Podfile"
      - ".github/workflows/smb-playback-e2e.yml"

jobs:
  e2e:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest available Xcode
        run: |
          set -e
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install tools (XcodeGen, Samba, ffmpeg)
        run: brew install xcodegen samba ffmpeg

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Install CocoaPods dependencies (MobileVLCKit)
        run: pod install --repo-update

      - name: Build for the Simulator
        run: |
          set -e
          xcodebuild build \
            -workspace VlcCustomIOS.xcworkspace \
            -scheme VlcCustomIOS \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Make test clips
        run: |
          set -e
          mkdir -p /tmp/smb/media/Phim
          # MP4 without faststart: the moov index sits at the END, so the player must jump there and back —
          # exactly the overlapping-request pattern that used to deadlock the proxy.
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 \
            -t 90 -c:v libx264 -b:v 6M -pix_fmt yuv420p -c:a aac "/tmp/smb/media/Phim/clip_moov_end.mp4"
          # HEVC in MKV with AC3 audio, and a name with Vietnamese characters, spaces and "&".
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30 -f lavfi -i sine=frequency=660 \
            -t 90 -c:v libx265 -b:v 6M -tag:v hvc1 -c:a ac3 "/tmp/smb/media/Phim/Phim thử & test.mkv"
          # Fragmented MP4 (empty moov, samples in many small moof fragments: "STTS table of 0 entries") - the kind
          # of file that failed on a real server through libVLC's SMB module but plays on Android via a proxy.
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=520 \
            -t 120 -c:v libx264 -b:v 5M -g 15 -pix_fmt yuv420p -c:a aac \
            -movflags frag_keyframe+empty_moov+default_base_moof -frag_duration 250000 "/tmp/smb/media/Phim/fragmented.mp4"
          ls -la /tmp/smb/media/Phim

      - name: Start Samba
        run: |
          set -e
          # Homebrew installs it as samba-dot-org-smbd so it does not clash with macOS's own smbd.
          SMBD=$(find "$(brew --prefix samba)/" \( -name samba-dot-org-smbd -o -name smbd \) \( -type f -o -type l \) | head -1)
          SMBPASSWD=$(find "$(brew --prefix samba)/" -name smbpasswd -type f -perm -u+x | head -1)
          echo "smbd=$SMBD smbpasswd=$SMBPASSWD"
          mkdir -p /tmp/smb/{run,lock,state,cache,private,log}
          # Samba's default config path: samba-dcerpcd (which serves share enumeration, what the app's listShares
          # needs) is spawned on demand and reads only this, not smbd's --configfile.
          CONF="$(brew --prefix)/etc/smb.conf"
          mkdir -p "$(dirname "$CONF")"
          cat > "$CONF" <<EOF
          [global]
            server role = standalone server
            server min protocol = SMB2
            smb ports = 4450
            disable netbios = yes
            passdb backend = tdbsam:/tmp/smb/private/passdb.tdb
            pid directory = /tmp/smb/run
            lock directory = /tmp/smb/lock
            state directory = /tmp/smb/state
            cache directory = /tmp/smb/cache
            private dir = /tmp/smb/private
            ncalrpc dir = /tmp/smb/run/ncalrpc
            log file = /tmp/smb/log/log.%m
            log level = 1
          [media]
            path = /tmp/smb/media
            read only = yes
            valid users = $(whoami)
          EOF
          printf 'testpass\ntestpass\n' | sudo "$SMBPASSWD" -c "$CONF" -s -a "$(whoami)"
          test -n "$SMBD"
          sudo "$SMBD" --daemon --configfile="$CONF"
          sleep 3
          sudo lsof -nP -iTCP:4450 -sTCP:LISTEN || true
          SMBCLIENT=$(find "$(brew --prefix samba)/" -name smbclient -type f -perm -u+x | head -1)
          "$SMBCLIENT" //127.0.0.1/media -p 4450 -U "$(whoami)%testpass" -m SMB3 -c 'ls Phim/*'
          "$SMBCLIENT" -L 127.0.0.1 -p 4450 -U "$(whoami)%testpass" -m SMB3

      - name: Play each clip over SMB in the Simulator
        run: |
          set -e
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if 'iPhone' in d['name']:
                      print(d['udid']); sys.exit(0)
          sys.exit(1)
          ")
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "VlcCustomIOS.app" | head -1)
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          DATA=$(xcrun simctl get_app_container "$DEVICE_ID" com.vlccustom.ios data)
          mkdir -p e2e
          FAILED=0
          # clip|route|required - the fragmented file is tried both ways; its direct run is informational.
          for CASE in "media/Phim/clip_moov_end.mp4|direct|1" "media/Phim/Phim thử & test.mkv|direct|1" \
                      "media/Phim/clip_moov_end.mp4|proxy|1" "media/Phim/fragmented.mp4|proxy|1" \
                      "media/Phim/fragmented.mp4|direct|0"; do
            CLIP="${CASE%%|*}"; REST="${CASE#*|}"; ROUTE="${REST%%|*}"; REQUIRED="${REST##*|}"
            TAG=$(basename "$CLIP" | tr -c 'A-Za-z0-9._-' '_')_$ROUTE
            xcrun simctl terminate "$DEVICE_ID" com.vlccustom.ios >/dev/null 2>&1 || true
            rm -f "$DATA/Library/Caches/vlc_diagnostics.log"
            SIMCTL_CHILD_DEMO_SMB_HOST="127.0.0.1:4450" \
            SIMCTL_CHILD_DEMO_SMB_USER="$(whoami)" \
            SIMCTL_CHILD_DEMO_SMB_PASS="testpass" \
            SIMCTL_CHILD_DEMO_SMB_FILE="$CLIP" \
            SIMCTL_CHILD_DEMO_SMB_ROUTE="$ROUTE" \
              xcrun simctl launch "$DEVICE_ID" com.vlccustom.ios
            sleep 12
            xcrun simctl io "$DEVICE_ID" screenshot "e2e/${TAG}_12s.png"
            sleep 13
            xcrun simctl io "$DEVICE_ID" screenshot "e2e/${TAG}_25s.png"
            cp "$DATA/Library/Caches/vlc_diagnostics.log" "e2e/${TAG}.log" || echo "no log file" > "e2e/${TAG}.log"
            echo "===== $CLIP: app lines ====="
            grep '^\[app\]' "e2e/${TAG}.log" | head -80 || true
            echo "===== $CLIP: libVLC errors ====="
            grep -iE 'error|fail|cannot|unable' "e2e/${TAG}.log" | grep -v '^\[app\]' | head -40 || true
            # Must reach at least 10s of playback within ~25s wall time.
            OPEN=$(grep -m1 -E 'player: .* route=' "e2e/${TAG}.log" | awk '{print $2}')
            FIRST=$(grep -m1 -E 'player: time=[0-9]+ms' "e2e/${TAG}.log" | awk '{print $2}')
            echo "opened at $OPEN, first playback time reported at $FIRST"
            if grep -q 'retrying via' "e2e/${TAG}.log"; then
              echo "FAIL: $CLIP [$ROUTE] failed and the app switched routes"
              if [ "$REQUIRED" = "1" ]; then FAILED=1; fi
            elif grep -qE 'player: time=(1[0-9]|[2-9][0-9])[0-9]{3}ms' "e2e/${TAG}.log"; then
              echo "PASS: $CLIP [$ROUTE] played past 10s"
            else
              echo "FAIL: $CLIP [$ROUTE] did not play past 10s"
              if [ "$REQUIRED" = "1" ]; then FAILED=1; fi
            fi
          done
          exit $FAILED

      - name: Samba logs
        if: always()
        run: sudo sh -c 'cat /tmp/smb/log/* 2>/dev/null | tail -100' || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smb-playback-e2e
          path: e2e/
