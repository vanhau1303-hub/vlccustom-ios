name: Build unsigned IPA

# Runs entirely on GitHub's macOS cloud runner — nobody needs to own a Mac.
# Trigger from Windows with: gh workflow run build-ipa.yml
# or just by pushing to main.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    # macOS runners cost 10x the minutes of a Linux one (private repo) — don't burn them on doc-only pushes.
    paths:
      - "VlcCustomIOS/**"
      - "project.yml"
      - "Podfile"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The runner ships several Xcode versions side by side; xcode-select defaults to an older one that can be too
      # old to open the project XcodeGen just wrote (newer XcodeGen writes a newer pbxproj format). Always pick the
      # newest Xcode actually installed on the runner instead of hard-coding a version that will drift over time.
      - name: Select the newest available Xcode
        run: |
          set -e
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Install CocoaPods dependencies (MobileVLCKit)
        run: pod install --repo-update

      - name: List schemes (debug)
        run: xcodebuild -workspace VlcCustomIOS.xcworkspace -list

      - name: Resolve Swift Package dependencies (AMSMB2)
        run: xcodebuild -resolvePackageDependencies -workspace VlcCustomIOS.xcworkspace -scheme VlcCustomIOS

      - name: Archive (unsigned)
        run: |
          set -e
          xcodebuild archive \
            -workspace VlcCustomIOS.xcworkspace \
            -scheme VlcCustomIOS \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/VlcCustomIOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          test -d build/VlcCustomIOS.xcarchive

      - name: Package the .ipa (unsigned — AltStore/Sideloadly re-sign it on install)
        run: |
          set -e
          APP_PATH="build/VlcCustomIOS.xcarchive/Products/Applications/VlcCustomIOS.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r -q VlcCustomIOS.ipa Payload
          ls -la VlcCustomIOS.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: VlcCustomIOS-unsigned-ipa
          path: build/VlcCustomIOS.ipa
          retention-days: 30
