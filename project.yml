name: VlcCustomIOS
options:
  bundleIdPrefix: com.vlccustom
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    from: 4.0.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.1.0
  # Ads in the free version (AdMob) and Google's consent form (EEA / UK).
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 2.0.0
targets:
  VlcCustomIOS:
    type: application
    platform: iOS
    sources:
      - path: VlcCustomIOS
    info:
      path: VlcCustomIOS/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        # App Store name (the target / executable keep their old internal name; nothing user-facing says VLC —
        # VideoLAN's trademark).
        CFBundleDisplayName: "LAN Player"
        CFBundleName: "LAN Player"
        # Only standard HTTPS / SMB encryption: no export compliance paperwork per upload.
        ITSAppUsesNonExemptEncryption: false
        # AdMob (free version). Google's test ids unless the App Store build passes the real ones.
        GADApplicationIdentifier: "$(LAN_ADMOB_APP_ID)"
        LANAdBannerUnit: "$(LAN_AD_BANNER_UNIT)"
        LANAdInterstitialUnit: "$(LAN_AD_INTERSTITIAL_UNIT)"
        # OpenSubtitles.com API key (App Store builds: from a GitHub secret; empty here).
        LANOpenSubtitlesKey: "$(LAN_OPENSUBTITLES_KEY)"
        NSUserTrackingUsageDescription: "Cho phép để quảng cáo trong bản miễn phí phù hợp hơn với bạn. Bản Pro không có quảng cáo."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        UILaunchScreen: {}
        # Without this key iPhone ProMotion screens cap third-party apps at 60Hz: scrolling, swipes and animations
        # now run at up to 120Hz.
        CADisableMinimumFrameDurationOnPhone: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "LAN Player cần quyền mạng cục bộ để duyệt và phát video từ máy tính chia sẻ qua SMB trong cùng mạng Wi-Fi."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vanhau1303.lanplayer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Unsigned by default (sideload .ipa, CI tests). The App Store workflow (.github/workflows/appstore.yml) sets
        # LAN_SIGNING=YES and the identity / team / profile — for this target only, the CocoaPods ones stay unsigned
        # until they are embedded.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "$(LAN_SIGN_IDENTITY)"
        CODE_SIGNING_REQUIRED: "$(LAN_SIGNING)"
        CODE_SIGNING_ALLOWED: "$(LAN_SIGNING)"
        DEVELOPMENT_TEAM: "$(LAN_TEAM_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(LAN_PROFILE_NAME)"
        LAN_SIGNING: "NO"
        LAN_SIGN_IDENTITY: ""
        LAN_TEAM_ID: ""
        LAN_PROFILE_NAME: ""
        SWIFT_VERSION: "5.0"
        # Declarations of the few libVLC C functions VLCSnapshotter calls directly.
        SWIFT_OBJC_BRIDGING_HEADER: VlcCustomIOS/LibVLCBridge.h
        # iPhone only for the first App Store version (iPad would need every orientation and its own screenshots).
        TARGETED_DEVICE_FAMILY: "1"
        # Apple's translation framework exists from iOS 17.4 / 18; the app runs from iOS 16.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "Translation"]
        LAN_ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        LAN_AD_BANNER_UNIT: ca-app-pub-3940256099942544/2934735716
        LAN_AD_INTERSTITIAL_UNIT: ca-app-pub-3940256099942544/4411468910
        LAN_OPENSUBTITLES_KEY: ""
    dependencies:
      # Explicit `embed: true` — without it, `xcodebuild archive` (used for the real .ipa) does not copy the AMSMB2
      # framework into the app bundle even though it links against it, so the app compiles and even runs fine from a
      # plain Simulator build, but crashes at launch on a real device with a dyld "Library not loaded" error. Caught
      # from a real crash log (2026-09-22). WhisperKit does NOT take `embed: true` — its SPM product is not a
      # separate framework bundle to copy (adding it makes the archive step itself fail looking for a
      # "WhisperKit" build product that does not exist); it links statically instead, which needs no embedding.
      - package: AMSMB2
        embed: true
      - package: WhisperKit
        product: WhisperKit
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
